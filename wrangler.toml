# HARUS sama dengan nama Worker yang dipilih di dashboard Cloudflare.
name = "openinapp"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# Host persis, tanpa https:// dan tanpa path. Pisahkan dengan koma.
# Contoh wildcard jika diperlukan: "gsolusi.id,*.gsolusi.id"
# Default sementara disesuaikan dengan GSolusi. Ganti jika tujuan iklan berbeda.
ALLOWED_HOSTS = "gsolusi.id,www.gsolusi.id"
